<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>TimeBox</title>

<!-- TimeBox アイコン -->
<link rel="icon" type="image/svg+xml" href="./gemini-svg%20(1).svg">
<link rel="apple-touch-icon" href="./gemini-svg%20(1).svg">

<!-- ホーム画面用 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TimeBox">
<meta name="theme-color" content="#1677ff">

<style>
:root{
  --accent:#1677ff;
  --accent2:#0d5bd7;
  --bg:#eef3f8;
  --card:#ffffff;
  --text:#111111;
  --muted:#68707c;
  --line:#dfe4ea;
  --danger:#e53935;
  --event:#1677ff;
  --today-bg:#eef6ff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

body.dark{
  --bg:#0d0f12;
  --card:#181b20;
  --text:#ffffff;
  --muted:#9aa2ad;
  --line:#30343b;
  --today-bg:#17263a;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  transition:.15s;
}

button:hover{
  transform:translateY(-1px);
}

button:active{
  transform:scale(.98);
}

.primary{
  background:var(--accent);
  color:#fff;
}

.danger{
  background:var(--danger);
  color:#fff;
}

input,
select{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:10px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--accent);
}

.app{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:18px;
}

/* HEADER */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.logo span{
  color:var(--accent);
}

.header-buttons{
  display:flex;
  gap:8px;
}

/* NAV */

nav{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:12px;
}

nav button{
  white-space:nowrap;
}

nav button.active{
  background:var(--accent);
  color:#fff;
}

/* PAGE */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* CLOCK */

.clock-card{
  background:var(--card);
  border-radius:25px;
  padding:50px 20px;
  text-align:center;
}

.clock-time{
  font-size:clamp(55px,12vw,125px);
  font-weight:800;
  letter-spacing:2px;
}

.clock-date{
  margin-top:10px;
  color:var(--muted);
  font-size:19px;
}

.remaining{
  margin-top:25px;
  color:var(--muted);
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-top:15px;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
}

/* GENERAL */

.big-number{
  font-size:65px;
  font-weight:800;
  text-align:center;
  margin:35px 0;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

/* =========================
   CALENDAR
========================= */

.calendar-toolbar{
  background:var(--bg);
  position:sticky;
  top:0;
  z-index:40;
  padding:5px 0 12px;
}

.calendar-toolbar-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.calendar-title{
  font-size:24px;
  font-weight:800;
}

.calendar-range{
  color:var(--muted);
  margin-top:4px;
  font-size:14px;
}

.calendar-actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

.view-switch{
  display:flex;
  background:var(--card);
  border-radius:12px;
  padding:3px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.view-switch button{
  box-shadow:none;
  padding:8px 12px;
  border-radius:9px;
}

.view-switch button.active{
  background:var(--accent);
  color:#fff;
}

/* WEEK */

.calendar-container{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.week-calendar{
  display:grid;
  grid-template-columns:65px repeat(7,minmax(120px,1fr));
  min-width:920px;
}

.calendar-scroll{
  overflow:auto;
  height:calc(100vh - 235px);
  min-height:550px;
}

.week-head{
  position:sticky;
  top:0;
  z-index:30;
  background:var(--card);
  border-bottom:1px solid var(--line);
}

.time-head{
  border-right:1px solid var(--line);
}

.day-head{
  text-align:center;
  padding:10px 5px;
  border-right:1px solid var(--line);
}

.day-head-name{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

.day-head-number{
  margin:4px auto 0;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:18px;
  font-weight:800;
}

.day-head.today .day-head-number{
  background:var(--accent);
  color:#fff;
}

.day-head.today .day-head-name{
  color:var(--accent);
}

.time-column{
  border-right:1px solid var(--line);
  background:var(--card);
}

.time-label{
  height:60px;
  position:relative;
  border-bottom:1px solid var(--line);
}

.time-label span{
  position:absolute;
  right:8px;
  top:-8px;
  color:var(--muted);
  font-size:11px;
}

.day-column{
  position:relative;
  height:1440px;
  border-right:1px solid var(--line);
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 29px,
      var(--line) 30px,
      transparent 31px,
      transparent 59px,
      var(--line) 60px
    );
}

.day-column.today{
  background-color:var(--today-bg);
}

.hour-line{
  position:absolute;
  left:0;
  right:0;
  height:1px;
  background:var(--line);
}

/* EVENTS */

.calendar-event{
  position:absolute;
  left:3px;
  right:3px;
  border-radius:7px;
  padding:5px 7px;
  color:#fff;
  overflow:hidden;
  cursor:pointer;
  z-index:10;
  box-shadow:0 2px 5px rgba(0,0,0,.18);
  border-left:3px solid rgba(255,255,255,.45);
}

.calendar-event:hover{
  filter:brightness(.96);
  z-index:20;
}

.calendar-event-title{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.calendar-event-time{
  font-size:10px;
  opacity:.9;
  margin-top:2px;
}

/* CURRENT LINE */

.current-line{
  position:absolute;
  left:0;
  right:0;
  height:2px;
  background:#e53935;
  z-index:25;
  pointer-events:none;
}

.current-dot{
  position:absolute;
  left:-5px;
  top:-4px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#e53935;
}

/* MONTH */

.month-calendar{
  display:none;
  padding:10px;
}

.month-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}

.month-weekday{
  text-align:center;
  padding:10px;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.month-day{
  min-height:120px;
  padding:7px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:var(--card);
}

.month-day.other-month{
  opacity:.45;
}

.month-day.today{
  background:var(--today-bg);
}

.month-number{
  width:27px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:13px;
  font-weight:800;
  margin-bottom:5px;
}

.month-day.today .month-number{
  background:var(--accent);
  color:#fff;
}

.month-event{
  display:block;
  width:100%;
  border:0;
  border-radius:5px;
  padding:4px 6px;
  margin:3px 0;
  color:#fff;
  font-size:11px;
  text-align:left;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  box-shadow:none;
}

/* DAY */

.day-calendar{
  display:none;
  min-width:500px;
}

.day-calendar-grid{
  display:grid;
  grid-template-columns:65px 1fr;
}

.day-column-single{
  position:relative;
  height:1440px;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 29px,
      var(--line) 30px,
      transparent 31px,
      transparent 59px,
      var(--line) 60px
    );
}

.day-single-head{
  text-align:center;
  padding:12px;
  border-bottom:1px solid var(--line);
  font-weight:800;
}

/* TIMER */

.timer-card{
  max-width:800px;
  margin:auto;
}

/* ALARM */

.alarm-list{
  display:grid;
  gap:10px;
  margin-top:15px;
}

.alarm{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:15px;
  border-radius:14px;
  background:var(--bg);
}

.alarm-time{
  font-size:25px;
  font-weight:800;
}

/* WORLD */

.world-list{
  display:grid;
  gap:10px;
  margin-top:15px;
}

.world{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:15px;
  border-radius:13px;
  background:var(--bg);
}

.world-time{
  font-size:22px;
  font-weight:800;
}

/* LAPS */

.laps{
  max-height:250px;
  overflow:auto;
  margin-top:15px;
}

.lap{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid var(--line);
}

/* SETTINGS */

.theme-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:10px;
  margin-top:15px;
}

.theme{
  padding:18px 10px;
  border-radius:15px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  text-align:center;
}

.theme.blue{background:#1677ff}
.theme.purple{background:#7b4dff}
.theme.green{background:#16a36a}
.theme.orange{background:#f27b22}
.theme.red{background:#e53935}
.theme.pink{background:#e84d9b}
.theme.cyan{background:#00a8c6}

/* MODAL */

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.55);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:440px;
  background:var(--card);
  border-radius:22px;
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.modal h2{
  margin-top:0;
}

.form{
  display:grid;
  gap:9px;
}

.form label{
  font-size:13px;
  color:var(--muted);
}

.form input,
.form select{
  width:100%;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.modal-buttons button{
  flex:1;
}

.color-options{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.color-option{
  width:32px;
  height:32px;
  padding:0;
  border-radius:50%;
  border:3px solid transparent;
  box-shadow:none;
}

.color-option.selected{
  border-color:var(--text);
  transform:scale(1.08);
}

/* RESPONSIVE */

@media(max-width:800px){

  .app{
    padding:10px;
  }

  header{
    margin-bottom:7px;
  }

  .logo{
    font-size:21px;
  }

  .calendar-toolbar-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .calendar-actions{
    width:100%;
  }

  .calendar-actions button{
    flex:1;
  }

  .view-switch{
    width:100%;
  }

  .view-switch button{
    flex:1;
  }

  .calendar-scroll{
    height:calc(100vh - 290px);
  }

  .month-day{
    min-height:90px;
  }
}

@media(max-width:600px){

  .clock-card{
    padding:35px 10px;
  }

  .big-number{
    font-size:50px;
  }

  .month-day{
    min-height:75px;
    padding:4px;
  }

  .month-weekday{
    padding:7px 2px;
    font-size:10px;
  }

  .month-event{
    font-size:9px;
    padding:3px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">⏰ <span>TimeBox</span></div>

  <div class="header-buttons">
    <button onclick="toggleDark()" title="ダークモード">🌙</button>
    <button class="primary" onclick="openEventModal()">＋ 予定</button>
  </div>
</header>

<nav>
  <button class="active" onclick="showPage('clock',this)">時計</button>
  <button onclick="showPage('schedule',this)">📅 予定</button>
  <button onclick="showPage('timer',this)">⏳ タイマー</button>
  <button onclick="showPage('stopwatch',this)">⏱️ ストップウォッチ</button>
  <button onclick="showPage('alarm',this)">⏰ アラーム</button>
  <button onclick="showPage('world',this)">🌍 世界時計</button>
  <button onclick="showPage('settings',this)">⚙️ 設定</button>
</nav>

<!-- 時計 -->

<section id="clock" class="page active">

  <div class="clock-card">

    <div class="clock-time" id="mainTime">
      00:00:00
    </div>

    <div class="clock-date" id="mainDate">
      ----
    </div>

    <div class="remaining" id="remaining">
      今日の残り時間：--
    </div>

  </div>

  <div class="info-grid">

    <div class="card">
      <h3>📅 今日</h3>
      <p id="todayInfo">---</p>
    </div>

    <div class="card">
      <h3>📊 今日の進行</h3>
      <p id="dayProgress">0%</p>
    </div>

  </div>

</section>


<!-- 予定 -->

<section id="schedule" class="page">

  <div class="calendar-toolbar">

    <div class="calendar-toolbar-top">

      <div>
        <div class="calendar-title">📅 カレンダー</div>
        <div class="calendar-range" id="calendarRange"></div>
      </div>

      <div class="calendar-actions">

        <button onclick="goToday()">今日</button>

        <button onclick="changeCalendar(-1)">←</button>

        <button onclick="changeCalendar(1)">→</button>

        <div class="view-switch">

          <button
            id="dayViewButton"
            onclick="setCalendarView('day')">
            日
          </button>

          <button
            id="weekViewButton"
            class="active"
            onclick="setCalendarView('week')">
            週
          </button>

          <button
            id="monthViewButton"
            onclick="setCalendarView('month')">
            月
          </button>

        </div>

      </div>

    </div>

  </div>

  <div class="calendar-container">

    <div id="weekCalendar" class="calendar-scroll"></div>

    <div id="dayCalendar" class="calendar-scroll"></div>

    <div id="monthCalendar" class="month-calendar"></div>

  </div>

</section>


<!-- タイマー -->

<section id="timer" class="page">

  <div class="card timer-card">

    <h2>⏳ タイマー</h2>

    <div class="big-number" id="timerDisplay">
      05:00
    </div>

    <div class="controls">
      <button onclick="setTimer(60)">1分</button>
      <button onclick="setTimer(300)">5分</button>
      <button onclick="setTimer(600)">10分</button>
      <button onclick="setTimer(1800)">30分</button>
      <button onclick="setTimer(3600)">1時間</button>
    </div>

    <br>

    <div class="controls">

      <input id="timerMin" type="number" min="0" placeholder="分">

      <input id="timerSec" type="number" min="0" max="59" placeholder="秒">

      <button onclick="customTimer()">設定</button>

    </div>

    <br>

    <div class="controls">
      <button class="primary" onclick="startTimer()">▶ スタート</button>
      <button onclick="pauseTimer()">⏸ 一時停止</button>
      <button onclick="resetTimer()">↩ リセット</button>
    </div>

  </div>

</section>


<!-- ストップウォッチ -->

<section id="stopwatch" class="page">

  <div class="card">

    <h2>⏱️ ストップウォッチ</h2>

    <div class="big-number" id="stopwatchDisplay">
      00:00.00
    </div>

    <div class="controls">
      <button class="primary" onclick="startStopwatch()">▶ スタート</button>
      <button onclick="pauseStopwatch()">⏸ 一時停止</button>
      <button onclick="lapStopwatch()">🏁 ラップ</button>
      <button onclick="resetStopwatch()">↩ リセット</button>
    </div>

    <div class="laps" id="laps"></div>

  </div>

</section>


<!-- アラーム -->

<section id="alarm" class="page">

  <div class="card">

    <h2>⏰ アラーム</h2>

    <div class="controls">

      <input id="alarmTime" type="time">

      <button class="primary" onclick="addAlarm()">＋ 追加</button>

    </div>

    <div class="alarm-list" id="alarmList"></div>

  </div>

</section>


<!-- 世界時計 -->

<section id="world" class="page">

  <div class="card">

    <h2>🌍 世界時計</h2>

    <div class="controls">

      <select id="citySelect">

        <option value="Asia/Tokyo">東京 🇯🇵</option>
        <option value="America/New_York">ニューヨーク 🇺🇸</option>
        <option value="Europe/London">ロンドン 🇬🇧</option>
        <option value="Europe/Paris">パリ 🇫🇷</option>
        <option value="Asia/Singapore">シンガポール 🇸🇬</option>
        <option value="Australia/Sydney">シドニー 🇦🇺</option>
        <option value="America/Los_Angeles">ロサンゼルス 🇺🇸</option>

      </select>

      <button class="primary" onclick="addWorldClock()">＋ 追加</button>

    </div>

    <div class="world-list" id="worldList"></div>

  </div>

</section>


<!-- 設定 -->

<section id="settings" class="page">

  <div class="card">

    <h2>⚙️ 設定</h2>

    <h3>🎨 テーマカラー</h3>

    <div class="theme-grid">

      <div class="theme blue" onclick="setTheme('#1677ff','#0d5bd7')">BLUE</div>
      <div class="theme purple" onclick="setTheme('#7b4dff','#5e31d7')">PURPLE</div>
      <div class="theme green" onclick="setTheme('#16a36a','#08794c')">GREEN</div>
      <div class="theme orange" onclick="setTheme('#f27b22','#d45c08')">ORANGE</div>
      <div class="theme red" onclick="setTheme('#e53935','#bd211e')">RED</div>
      <div class="theme pink" onclick="setTheme('#e84d9b','#c52b78')">PINK</div>
      <div class="theme cyan" onclick="setTheme('#00a8c6','#00839b')">CYAN</div>

    </div>

    <hr>

    <h3>🕐 時計</h3>

    <label>
      <input type="checkbox" id="format24" checked onchange="saveSettings()">
      24時間表示
    </label>

    <br><br>

    <label>
      <input type="checkbox" id="showSeconds" checked onchange="saveSettings()">
      秒を表示
    </label>

    <hr>

    <button onclick="clearAllData()">
      🗑️ 保存データを削除
    </button>

  </div>

</section>

</div>


<!-- 予定モーダル -->

<div class="modal-bg" id="eventModal">

  <div class="modal">

    <h2 id="modalTitle">＋ 予定を追加</h2>

    <div class="form">

      <label>予定の名前</label>

      <input
        id="eventName"
        type="text"
        placeholder="例：学校、映画、宿題">

      <label>日付</label>

      <input id="eventDate" type="date">

      <label>開始時刻</label>

      <input id="eventStart" type="time">

      <label>終了時刻</label>

      <input id="eventEnd" type="time">

      <label>予定の色</label>

      <div class="color-options">

        <button class="color-option" data-color="#1677ff"
          style="background:#1677ff"
          onclick="selectEventColor('#1677ff')"></button>

        <button class="color-option" data-color="#7b4dff"
          style="background:#7b4dff"
          onclick="selectEventColor('#7b4dff')"></button>

        <button class="color-option" data-color="#16a36a"
          style="background:#16a36a"
          onclick="selectEventColor('#16a36a')"></button>

        <button class="color-option" data-color="#f27b22"
          style="background:#f27b22"
          onclick="selectEventColor('#f27b22')"></button>

        <button class="color-option" data-color="#e53935"
          style="background:#e53935"
          onclick="selectEventColor('#e53935')"></button>

        <button class="color-option" data-color="#e84d9b"
          style="background:#e84d9b"
          onclick="selectEventColor('#e84d9b')"></button>

        <button class="color-option" data-color="#00a8c6"
          style="background:#00a8c6"
          onclick="selectEventColor('#00a8c6')"></button>

      </div>

    </div>

    <div class="modal-buttons">

      <button onclick="closeEventModal()">キャンセル</button>

      <button
        id="deleteEventButton"
        class="danger"
        onclick="deleteEditingEvent()"
        style="display:none">
        🗑️ 削除
      </button>

      <button class="primary" onclick="saveEvent()">保存</button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

let settings={
  format24:true,
  showSeconds:true,
  accent:"#1677ff",
  accent2:"#0d5bd7"
};

function loadSettings(){

  const saved=localStorage.getItem("timebox_settings");

  if(saved){

    try{
      settings={
        ...settings,
        ...JSON.parse(saved)
      };
    }catch(e){}

  }

  document.documentElement.style.setProperty(
    "--accent",
    settings.accent
  );

  document.documentElement.style.setProperty(
    "--accent2",
    settings.accent2
  );

  document.getElementById("format24").checked=settings.format24;
  document.getElementById("showSeconds").checked=settings.showSeconds;

  if(localStorage.getItem("timebox_dark")==="true"){
    document.body.classList.add("dark");
  }
}

function saveSettings(){

  settings.format24=
    document.getElementById("format24").checked;

  settings.showSeconds=
    document.getElementById("showSeconds").checked;

  localStorage.setItem(
    "timebox_settings",
    JSON.stringify(settings)
  );
}

function setTheme(accent,accent2){

  settings.accent=accent;
  settings.accent2=accent2;

  document.documentElement.style.setProperty("--accent",accent);
  document.documentElement.style.setProperty("--accent2",accent2);

  saveSettings();
}

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "timebox_dark",
    document.body.classList.contains("dark")
  );
}


/* =====================================================
   PAGE
===================================================== */

function showPage(id,btn){

  document.querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  document.querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  if(id==="schedule"){
    renderCalendar();
  }
}


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

  const now=new Date();

  let hour=now.getHours();

  if(!settings.format24){
    hour=hour%12 || 12;
  }

  const hh=String(hour).padStart(2,"0");
  const mm=String(now.getMinutes()).padStart(2,"0");
  const ss=String(now.getSeconds()).padStart(2,"0");

  document.getElementById("mainTime").textContent=
    settings.showSeconds
    ? `${hh}:${mm}:${ss}`
    : `${hh}:${mm}`;

  const days=[
    "日","月","火","水","木","金","土"
  ];

  document.getElementById("mainDate").textContent=
    `${now.getFullYear()}年`+
    `${now.getMonth()+1}月`+
    `${now.getDate()}日`+
    ` (${days[now.getDay()]})`;

  const midnight=new Date(now);
  midnight.setHours(24,0,0,0);

  const remain=Math.max(0,midnight-now)/1000;

  document.getElementById("remaining").textContent=
    `今日の残り時間：${formatHMS(remain)}`;

  const start=new Date(now);
  start.setHours(0,0,0,0);

  const progress=((now-start)/(midnight-start))*100;

  document.getElementById("dayProgress").textContent=
    progress.toFixed(1)+"%";

  document.getElementById("todayInfo").textContent=
    `現在 ${now.toLocaleTimeString("ja-JP")}`;

  if(document.getElementById("schedule").classList.contains("active")){
    updateCurrentCalendarLine();
  }
}

function formatHMS(sec){

  sec=Math.max(0,Math.floor(sec));

  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;

  return `${String(h).padStart(2,"0")}:`+
         `${String(m).padStart(2,"0")}:`+
         `${String(s).padStart(2,"0")}`;
}

setInterval(updateClock,250);


/* =====================================================
   CALENDAR DATA
===================================================== */

let calendarOffset=0;
let calendarView="week";

let events=[];

try{
  events=JSON.parse(
    localStorage.getItem("timebox_events")||"[]"
  );
}catch(e){
  events=[];
}

let editingEventId=null;
let selectedEventColor="#1677ff";


function dateKey(date){

  const y=date.getFullYear();

  const m=String(date.getMonth()+1).padStart(2,"0");

  const d=String(date.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function parseDate(key){

  const [y,m,d]=key.split("-").map(Number);

  return new Date(y,m-1,d);
}

function getMonday(offset=0){

  const date=new Date();

  date.setHours(0,0,0,0);

  const day=date.getDay();

  const diff=day===0?-6:1-day;

  date.setDate(
    date.getDate()+diff+(offset*7)
  );

  return date;
}

function changeCalendar(amount){

  if(calendarView==="week"){
    calendarOffset+=amount;
  }

  if(calendarView==="day"){
    calendarOffset+=amount;
  }

  if(calendarView==="month"){
    calendarOffset+=amount;
  }

  renderCalendar();
}

function goToday(){

  calendarOffset=0;
  renderCalendar();
}

function setCalendarView(view){

  calendarView=view;

  document.getElementById("dayViewButton")
    .classList.toggle("active",view==="day");

  document.getElementById("weekViewButton")
    .classList.toggle("active",view==="week");

  document.getElementById("monthViewButton")
    .classList.toggle("active",view==="month");

  renderCalendar();
}

function renderCalendar(){

  document.getElementById("weekCalendar").style.display=
    calendarView==="week" ? "block" : "none";

  document.getElementById("dayCalendar").style.display=
    calendarView==="day" ? "block" : "none";

  document.getElementById("monthCalendar").style.display=
    calendarView==="month" ? "block" : "none";

  if(calendarView==="week"){
    renderWeek();
  }

  if(calendarView==="day"){
    renderDay();
  }

  if(calendarView==="month"){
    renderMonth();
  }
}


/* =====================================================
   WEEK
===================================================== */

function renderWeek(){

  const container=document.getElementById("weekCalendar");

  container.innerHTML="";

  const monday=getMonday(calendarOffset);

  const sunday=new Date(monday);
  sunday.setDate(sunday.getDate()+6);

  document.getElementById("calendarRange").textContent=
    `${monday.getFullYear()}/${monday.getMonth()+1}/${monday.getDate()}`+
    ` ～ `+
    `${sunday.getFullYear()}/${sunday.getMonth()+1}/${sunday.getDate()}`;

  const wrapper=document.createElement("div");
  wrapper.className="week-calendar";

  const headEmpty=document.createElement("div");
  headEmpty.className="time-head week-head";
  wrapper.appendChild(headEmpty);

  const names=[
    "月","火","水","木","金","土","日"
  ];

  for(let i=0;i<7;i++){

    const date=new Date(monday);
    date.setDate(date.getDate()+i);

    const head=document.createElement("div");

    head.className="day-head week-head";

    if(dateKey(date)===dateKey(new Date())){
      head.classList.add("today");
    }

    head.innerHTML=
      `<div class="day-head-name">${names[i]}</div>`+
      `<div class="day-head-number">${date.getDate()}</div>`;

    head.onclick=()=>{
      openEventModal(dateKey(date));
    };

    wrapper.appendChild(head);
  }


  /* 時間列 */

  const timeColumn=document.createElement("div");
  timeColumn.className="time-column";

  for(let h=0;h<24;h++){

    const label=document.createElement("div");
    label.className="time-label";

    label.innerHTML=
      `<span>${String(h).padStart(2,"0")}:00</span>`;

    timeColumn.appendChild(label);
  }

  wrapper.appendChild(timeColumn);


  /* 7日 */

  for(let i=0;i<7;i++){

    const date=new Date(monday);
    date.setDate(date.getDate()+i);

    const column=document.createElement("div");
    column.className="day-column";

    if(dateKey(date)===dateKey(new Date())){
      column.classList.add("today");
    }

    for(let h=1;h<24;h++){

      const line=document.createElement("div");
      line.className="hour-line";
      line.style.top=`${h*60}px`;

      column.appendChild(line);
    }

    const dayEvents=events
      .filter(e=>e.date===dateKey(date))
      .sort((a,b)=>timeToMinutes(a.start)-timeToMinutes(b.start));

    renderEventsInColumn(column,dayEvents);

    if(dateKey(date)===dateKey(new Date())){
      addCurrentLine(column);
    }

    column.addEventListener("dblclick",e=>{

      if(e.target!==column)return;

      const rect=column.getBoundingClientRect();

      const y=e.clientY-rect.top;

      let minutes=Math.floor(y);

      minutes=Math.floor(minutes/15)*15;

      if(minutes>=1440)minutes=1430;

      const h=Math.floor(minutes/60);
      const m=minutes%60;

      const start=
        `${String(h).padStart(2,"0")}:`+
        `${String(m).padStart(2,"0")}`;

      const endMinutes=Math.min(minutes+60,1439);

      const eh=Math.floor(endMinutes/60);
      const em=endMinutes%60;

      openEventModal(
        dateKey(date),
        null,
        start,
        `${String(eh).padStart(2,"0")}:${String(em).padStart(2,"0")}`
      );
    });

    wrapper.appendChild(column);
  }

  container.appendChild(wrapper);

  setTimeout(()=>{
    scrollCalendarToNow();
  },50);
}


/* =====================================================
   DAY
===================================================== */

function renderDay(){

  const container=document.getElementById("dayCalendar");

  container.innerHTML="";

  const base=new Date();
  base.setHours(0,0,0,0);

  base.setDate(
    base.getDate()+calendarOffset
  );

  document.getElementById("calendarRange").textContent=
    `${base.getFullYear()}年`+
    `${base.getMonth()+1}月`+
    `${base.getDate()}日`;

  const grid=document.createElement("div");
  grid.className="day-calendar-grid";

  const times=document.createElement("div");
  times.className="time-column";

  for(let h=0;h<24;h++){

    const label=document.createElement("div");
    label.className="time-label";

    label.innerHTML=
      `<span>${String(h).padStart(2,"0")}:00</span>`;

    times.appendChild(label);
  }

  grid.appendChild(times);

  const right=document.createElement("div");

  const head=document.createElement("div");
  head.className="day-single-head";

  const names=[
    "日","月","火","水","木","金","土"
  ];

  head.textContent=
    `${names[base.getDay()]}曜日 ${base.getMonth()+1}/${base.getDate()}`;

  right.appendChild(head);

  const column=document.createElement("div");
  column.className="day-column-single";

  for(let h=1;h<24;h++){

    const line=document.createElement("div");
    line.className="hour-line";
    line.style.top=`${h*60}px`;

    column.appendChild(line);
  }

  const dayEvents=events
    .filter(e=>e.date===dateKey(base))
    .sort((a,b)=>timeToMinutes(a.start)-timeToMinutes(b.start));

  renderEventsInColumn(column,dayEvents);

  if(dateKey(base)===dateKey(new Date())){
    addCurrentLine(column);
  }

  column.addEventListener("dblclick",e=>{

    if(e.target!==column)return;

    const rect=column.getBoundingClientRect();

    let minutes=Math.floor(e.clientY-rect.top);

    minutes=Math.floor(minutes/15)*15;

    if(minutes>=1440)minutes=1430;

    const h=Math.floor(minutes/60);
    const m=minutes%60;

    openEventModal(
      dateKey(base),
      null,
      `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`,
      `${String(Math.floor((minutes+60)/60)).padStart(2,"0")}:${String((minutes+60)%60).padStart(2,"0")}`
    );
  });

  right.appendChild(column);

  grid.appendChild(right);

  container.appendChild(grid);

  setTimeout(scrollCalendarToNow,50);
}


/* =====================================================
   MONTH
===================================================== */

function renderMonth(){

  const container=document.getElementById("monthCalendar");

  container.innerHTML="";

  const now=new Date();

  const first=new Date(
    now.getFullYear(),
    now.getMonth()+calendarOffset,
    1
  );

  const year=first.getFullYear();
  const month=first.getMonth();

  const last=new Date(year,month+1,0);

  document.getElementById("calendarRange").textContent=
    `${year}年${month+1}月`;

  const grid=document.createElement("div");
  grid.className="month-grid";

  const names=[
    "月","火","水","木","金","土","日"
  ];

  names.forEach(name=>{

    const el=document.createElement("div");
    el.className="month-weekday";
    el.textContent=name;

    grid.appendChild(el);
  });

  let firstDay=first.getDay();

  firstDay=firstDay===0?6:firstDay-1;

  const totalCells=
    Math.ceil((firstDay+last.getDate())/7)*7;

  for(let i=0;i<totalCells;i++){

    const dayNumber=
      i-firstDay+1;

    const date=new Date(year,month,dayNumber);

    const cell=document.createElement("div");
    cell.className="month-day";

    if(date.getMonth()!==month){
      cell.classList.add("other-month");
    }

    if(dateKey(date)===dateKey(new Date())){
      cell.classList.add("today");
    }

    const number=document.createElement("div");
    number.className="month-number";
    number.textContent=date.getDate();

    cell.appendChild(number);

    cell.onclick=()=>{
      openEventModal(dateKey(date));
    };

    const dayEvents=events
      .filter(e=>e.date===dateKey(date))
      .sort((a,b)=>timeToMinutes(a.start)-timeToMinutes(b.start));

    dayEvents.slice(0,5).forEach(e=>{

      const event=document.createElement("button");
      event.className="month-event";
      event.style.background=e.color||settings.accent;

      event.textContent=
        `${e.start} ${e.name}`;

      event.onclick=(ev)=>{
        ev.stopPropagation();
        openEventModal(null,e.id);
      };

      cell.appendChild(event);
    });

    if(dayEvents.length>5){

      const more=document.createElement("div");

      more.style.fontSize="10px";
      more.style.color="var(--muted)";
      more.textContent=
        `＋${dayEvents.length-5}件`;

      cell.appendChild(more);
    }

    grid.appendChild(cell);
  }

  container.appendChild(grid);
}


/* =====================================================
   EVENTS
===================================================== */

function renderEventsInColumn(column,dayEvents){

  const groups=[];

  dayEvents.forEach(event=>{

    const start=timeToMinutes(event.start);
    const end=Math.max(
      start+30,
      timeToMinutes(event.end)
    );

    let placed=false;

    for(const group of groups){

      const overlaps=group.some(other=>{

        const otherStart=timeToMinutes(other.start);
        const otherEnd=Math.max(
          otherStart+30,
          timeToMinutes(other.end)
        );

        return start<otherEnd && end>otherStart;
      });

      if(!overlaps){

        group.push(event);
        placed=true;
        break;
      }
    }

    if(!placed){
      groups.push([event]);
    }
  });


  dayEvents.forEach(event=>{

    let groupIndex=0;
    let group=null;

    for(let i=0;i<groups.length;i++){

      if(groups[i].includes(event)){
        groupIndex=i;
        group=groups[i];
        break;
      }
    }

    const start=timeToMinutes(event.start);

    let end=timeToMinutes(event.end);

    if(end<=start){
      end=start+60;
    }

    const div=document.createElement("div");

    div.className="calendar-event";

    div.style.top=`${start}px`;

    div.style.height=
      `${Math.max(30,end-start)}px`;

    const count=group ? group.length : 1;

    const index=group ? group.indexOf(event) : 0;

    div.style.width=
      `calc(${100/count}% - 5px)`;

    div.style.left=
      `calc(${index*100/count}% + 3px)`;

    div.style.right="auto";

    div.style.background=
      event.color || settings.accent;

    div.innerHTML=
      `<div class="calendar-event-title">
        ${escapeHTML(event.name)}
      </div>
      <div class="calendar-event-time">
        ${event.start}～${event.end}
      </div>`;

    div.onclick=()=>{
      openEventModal(null,event.id);
    };

    column.appendChild(div);
  });
}


/* =====================================================
   CURRENT LINE
===================================================== */

function addCurrentLine(column){

  const now=new Date();

  const minutes=
    now.getHours()*60+
    now.getMinutes()+
    now.getSeconds()/60;

  const line=document.createElement("div");

  line.className="current-line";

  line.style.top=`${minutes}px`;

  const dot=document.createElement("div");

  dot.className="current-dot";

  line.appendChild(dot);

  column.appendChild(line);
}

function updateCurrentCalendarLine(){

  if(!document.getElementById("schedule").classList.contains("active")){
    return;
  }

  const old=document.querySelectorAll(".current-line");

  old.forEach(x=>x.remove());

  if(calendarView==="week"){

    document.querySelectorAll(".day-column.today")
      .forEach(column=>{
        addCurrentLine(column);
      });
  }

  if(calendarView==="day"){

    const date=new Date();

    date.setHours(0,0,0,0);
    date.setDate(date.getDate()+calendarOffset);

    if(dateKey(date)===dateKey(new Date())){

      const column=
        document.querySelector(".day-column-single");

      if(column){
        addCurrentLine(column);
      }
    }
  }
}

function scrollCalendarToNow(){

  if(calendarView==="month")return;

  const scroll=
    calendarView==="week"
    ? document.getElementById("weekCalendar")
    : document.getElementById("dayCalendar");

  if(!scroll)return;

  const now=new Date();

  const target=
    Math.max(
      0,
      now.getHours()*60-180
    );

  scroll.scrollTop=target;
}


/* =====================================================
   EVENT MODAL
===================================================== */

function openEventModal(date=null,id=null,start=null,end=null){

  editingEventId=id;

  const modal=document.getElementById("eventModal");

  const deleteButton=
    document.getElementById("deleteEventButton");

  if(id){

    const event=events.find(e=>e.id===id);

    if(!event)return;

    document.getElementById("modalTitle")
      .textContent="✏️ 予定を編集";

    document.getElementById("eventName").value=event.name;
    document.getElementById("eventDate").value=event.date;
    document.getElementById("eventStart").value=event.start;
    document.getElementById("eventEnd").value=event.end;

    selectedEventColor=event.color||settings.accent;

    deleteButton.style.display="block";

  }else{

    document.getElementById("modalTitle")
      .textContent="＋ 予定を追加";

    document.getElementById("eventName").value="";

    document.getElementById("eventDate").value=
      date || dateKey(new Date());

    document.getElementById("eventStart").value=
      start || "09:00";

    document.getElementById("eventEnd").value=
      end || "10:00";

    selectedEventColor=settings.accent;

    deleteButton.style.display="none";
  }

  updateColorButtons();

  modal.classList.add("show");

  setTimeout(()=>{
    document.getElementById("eventName").focus();
  },50);
}

function updateColorButtons(){

  document.querySelectorAll(".color-option")
    .forEach(button=>{

      button.classList.toggle(
        "selected",
        button.dataset.color===selectedEventColor
      );

    });
}

function selectEventColor(color){

  selectedEventColor=color;

  updateColorButtons();
}

function closeEventModal(){

  document.getElementById("eventModal")
    .classList.remove("show");

  editingEventId=null;
}

function saveEvent(){

  const name=
    document.getElementById("eventName").value.trim();

  const date=
    document.getElementById("eventDate").value;

  const start=
    document.getElementById("eventStart").value;

  const end=
    document.getElementById("eventEnd").value;

  if(!name){

    alert("予定の名前を入力してください");

    return;
  }

  if(!date||!start||!end){

    alert("日付と時間を入力してください");

    return;
  }

  if(editingEventId){

    const event=events.find(
      e=>e.id===editingEventId
    );

    if(event){

      event.name=name;
      event.date=date;
      event.start=start;
      event.end=end;
      event.color=selectedEventColor;
    }

  }else{

    events.push({

      id:Date.now(),

      name,

      date,

      start,

      end,

      color:selectedEventColor

    });
  }

  saveEvents();

  closeEventModal();

  renderCalendar();
}

function deleteEditingEvent(){

  if(!editingEventId)return;

  if(!confirm("この予定を削除しますか？")){
    return;
  }

  events=events.filter(
    e=>e.id!==editingEventId
  );

  saveEvents();

  closeEventModal();

  renderCalendar();
}

function saveEvents(){

  localStorage.setItem(
    "timebox_events",
    JSON.stringify(events)
  );
}

function timeToMinutes(time){

  const parts=time.split(":").map(Number);

  return parts[0]*60+parts[1];
}

function escapeHTML(text){

  const div=document.createElement("div");

  div.textContent=text;

  return div.innerHTML;
}


/* =====================================================
   TIMER
===================================================== */

let timerSeconds=300;
let timerInterval=null;

function updateTimer(){

  const m=Math.floor(timerSeconds/60);
  const s=timerSeconds%60;

  document.getElementById("timerDisplay").textContent=
    `${String(m).padStart(2,"0")}:`+
    `${String(s).padStart(2,"0")}`;
}

function setTimer(seconds){

  pauseTimer();

  timerSeconds=seconds;

  updateTimer();
}

function customTimer(){

  pauseTimer();

  const min=parseInt(
    document.getElementById("timerMin").value
  )||0;

  const sec=parseInt(
    document.getElementById("timerSec").value
  )||0;

  timerSeconds=Math.max(0,min*60+sec);

  updateTimer();
}

function startTimer(){

  if(timerInterval||timerSeconds<=0)return;

  timerInterval=setInterval(()=>{

    timerSeconds--;

    updateTimer();

    if(timerSeconds<=0){

      pauseTimer();

      alert("⏰ タイマー終了！");

      beep();
    }

  },1000);
}

function pauseTimer(){

  clearInterval(timerInterval);

  timerInterval=null;
}

function resetTimer(){

  pauseTimer();

  timerSeconds=300;

  updateTimer();
}


/* =====================================================
   STOPWATCH
===================================================== */

let stopwatchElapsed=0;
let stopwatchStart=0;
let stopwatchInterval=null;

function updateStopwatch(){

  const sec=Math.floor(stopwatchElapsed/1000);

  const ms=Math.floor(
    (stopwatchElapsed%1000)/10
  );

  const min=Math.floor(sec/60);

  const seconds=sec%60;

  document.getElementById("stopwatchDisplay")
    .textContent=
      `${String(min).padStart(2,"0")}:`+
      `${String(seconds).padStart(2,"0")}.`+
      `${String(ms).padStart(2,"0")}`;
}

function startStopwatch(){

  if(stopwatchInterval)return;

  stopwatchStart=
    Date.now()-stopwatchElapsed;

  stopwatchInterval=setInterval(()=>{

    stopwatchElapsed=
      Date.now()-stopwatchStart;

    updateStopwatch();

  },10);
}

function pauseStopwatch(){

  clearInterval(stopwatchInterval);

  stopwatchInterval=null;
}

function resetStopwatch(){

  pauseStopwatch();

  stopwatchElapsed=0;

  document.getElementById("laps").innerHTML="";

  updateStopwatch();
}

function lapStopwatch(){

  const div=document.createElement("div");

  div.className="lap";

  div.innerHTML=
    `<span>ラップ</span>`+
    `<strong>${
      document.getElementById("stopwatchDisplay").textContent
    }</strong>`;

  document.getElementById("laps").prepend(div);
}


/* =====================================================
   ALARM
===================================================== */

let alarms=[];

try{
  alarms=JSON.parse(
    localStorage.getItem("timebox_alarms")||"[]"
  );
}catch(e){
  alarms=[];
}

function saveAlarms(){

  localStorage.setItem(
    "timebox_alarms",
    JSON.stringify(alarms)
  );
}

function addAlarm(){

  const time=
    document.getElementById("alarmTime").value;

  if(!time){

    alert("時刻を選んでください");

    return;
  }

  alarms.push({

    id:Date.now(),

    time,

    enabled:true

  });

  saveAlarms();

  renderAlarms();
}

function toggleAlarm(id){

  const alarm=
    alarms.find(x=>x.id===id);

  if(alarm){
    alarm.enabled=!alarm.enabled;
  }

  saveAlarms();

  renderAlarms();
}

function deleteAlarm(id){

  alarms=
    alarms.filter(x=>x.id!==id);

  saveAlarms();

  renderAlarms();
}

function renderAlarms(){

  const list=
    document.getElementById("alarmList");

  list.innerHTML="";

  alarms
    .sort((a,b)=>a.time.localeCompare(b.time))
    .forEach(alarm=>{

      const div=document.createElement("div");

      div.className="alarm";

      div.innerHTML=
        `<div>
          <div class="alarm-time">${alarm.time}</div>
          <small>${alarm.enabled?"ON":"OFF"}</small>
        </div>
        <div>
          <button onclick="toggleAlarm(${alarm.id})">
            ${alarm.enabled?"OFF":"ON"}
          </button>
          <button onclick="deleteAlarm(${alarm.id})">
            削除
          </button>
        </div>`;

      list.appendChild(div);
    });
}

let lastAlarm="";

function checkAlarms(){

  const now=new Date();

  const current=
    `${String(now.getHours()).padStart(2,"0")}:`+
    `${String(now.getMinutes()).padStart(2,"0")}`;

  if(current===lastAlarm)return;

  lastAlarm=current;

  alarms.forEach(alarm=>{

    if(alarm.enabled&&alarm.time===current){

      alert("⏰ アラーム："+current);

      beep();
    }

  });
}

setInterval(checkAlarms,1000);


/* =====================================================
   WORLD CLOCK
===================================================== */

let worldClocks=[];

try{
  worldClocks=JSON.parse(
    localStorage.getItem("timebox_world")||"[]"
  );
}catch(e){
  worldClocks=[];
}

function addWorldClock(){

  const select=
    document.getElementById("citySelect");

  const zone=select.value;

  const name=
    select.options[select.selectedIndex].text;

  if(worldClocks.some(x=>x.zone===zone)){
    return;
  }

  worldClocks.push({
    zone,
    name
  });

  localStorage.setItem(
    "timebox_world",
    JSON.stringify(worldClocks)
  );

  renderWorld();
}

function removeWorldClock(zone){

  worldClocks=
    worldClocks.filter(x=>x.zone!==zone);

  localStorage.setItem(
    "timebox_world",
    JSON.stringify(worldClocks)
  );

  renderWorld();
}

function renderWorld(){

  const list=
    document.getElementById("worldList");

  list.innerHTML="";

  worldClocks.forEach(x=>{

    const div=document.createElement("div");

    div.className="world";

    const safeId=
      x.zone.replace(/[^a-z0-9]/gi,"");

    div.innerHTML=
      `<div>${escapeHTML(x.name)}</div>
       <div class="world-time" id="world_${safeId}">
         --:--:--
       </div>
       <button onclick="removeWorldClock('${x.zone}')">
         ×
       </button>`;

    list.appendChild(div);
  });

  updateWorld();
}

function updateWorld(){

  worldClocks.forEach(x=>{

    const id=
      "world_"+
      x.zone.replace(/[^a-z0-9]/gi,"");

    const el=document.getElementById(id);

    if(!el)return;

    el.textContent=
      new Intl.DateTimeFormat(
        "ja-JP",
        {
          timeZone:x.zone,
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      ).format(new Date());
  });
}

setInterval(updateWorld,1000);


/* =====================================================
   SOUND
===================================================== */

function beep(){

  try{

    const ctx=new AudioContext();

    const osc=ctx.createOscillator();

    const gain=ctx.createGain();

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.frequency.value=880;

    gain.gain.value=.15;

    osc.start();

    setTimeout(()=>{

      osc.stop();

      ctx.close();

    },500);

  }catch(e){}
}


/* =====================================================
   CLEAR DATA
===================================================== */

function clearAllData(){

  if(!confirm(
    "予定・アラーム・世界時計などの保存データを削除しますか？"
  )){
    return;
  }

  localStorage.removeItem("timebox_events");
  localStorage.removeItem("timebox_alarms");
  localStorage.removeItem("timebox_world");

  events=[];
  alarms=[];
  worldClocks=[];

  renderCalendar();
  renderAlarms();
  renderWorld();
}

loadSettings();

updateClock();

updateTimer();

updateStopwatch();

renderAlarms();

renderWorld();

renderCalendar();

</script>
